<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elsa Studio</title>
    <base href="/" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="_content/Elsa.Studio.Shell/css/shell.css" rel="stylesheet" />
</head>
<body>
    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">&#10006;</a>
    </div>

    <script>
        // Provides the Elsa backend API URL to the Blazor WASM app at startup.
        // When served by the Api host (embedded mode) this dynamically resolves
        // to the same origin, so no hard-coded ports are needed.
        window.getClientConfig = function () {
            return {
                apiUrl: window.location.origin + '/elsa/api'
            };
        };
    </script>

    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
