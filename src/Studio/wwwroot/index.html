    <link rel="apple-touch-icon" sizes="180x180" href="_content/Elsa.Studio.Shell/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="_content/Elsa.Studio.Shell/favicon-32x32.png">

<body>
    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">&#10006;</a>
    </div>

    <script>
        // Provides the Elsa backend API URL to the Blazor WASM app at startup.
        // When served by the Api host (embedded mode) this dynamically resolves
        // to the same origin, so no hard-coded ports are needed.
        window.getClientConfig = function () {
            return {
                apiUrl: window.location.origin + '/elsa/api'
            };
        };
    </script>
